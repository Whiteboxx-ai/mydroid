name: Release
# Push a tag like v0.2.0 to build, attest and publish the Mac app, the Android APK and the extension zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (see docs/releasing.md)."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mydroid.jks"
      - name: Build
        env:
          MYDROID_KEYSTORE: ${{ runner.temp }}/mydroid.jks
          MYDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: scripts/release/build.sh "${GITHUB_REF_NAME}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Mydroid-mac.zip
            dist/Mydroid.apk
            dist/Mydroid-extension.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Mydroid ${GITHUB_REF_NAME#v}" --generate-notes \
            dist/Mydroid-mac.zip dist/Mydroid.apk dist/Mydroid-extension.zip dist/SHA256SUMS
