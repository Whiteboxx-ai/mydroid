name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer and build scripts
        run: |
          for script in install.sh scripts/release/*.sh mac/scripts/*.sh; do
            bash -n "$script"
          done
